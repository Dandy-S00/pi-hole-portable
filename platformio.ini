; PlatformIO project for Waveshare ESP32-S3 + SD card DNS sinkhole
[env:waveshare-esp32s3]
platform = espressif32
board = esp32-s3-devkitc-1      ; generic ESP32-S3; set to your exact board if needed
; If your Waveshare board is e.g. esp32-s3-zero, use: board = esp32-s3-zero
framework = arduino
board_build.flash_mode = qio
board_build.mcu = esp32s3
upload_speed = 921600

; 8MB PSRAM/flash boards: enable PSRAM if your module has it (most Waveshare S3 do)
board_build.arduino.memory_type = qio_qspi
build_flags =
  -DBOARD_HAS_PSRAM
  -mfix-esp32-psi

monitor_speed = 115200

lib_deps =
  ; nothing external required - SD_MMC, WiFi, WebServer are in the core

; Optional: upload filesystem image (none used here; blocklist goes on the SD card)
