; PlatformIO project for Waveshare ESP32-S3 + SD card DNS sinkhole
; The blocklist is binary-searched directly from the SD card, so it uses
; almost no RAM -- PSRAM is optional. Safe default: enable it for boards that
; have it (most Waveshare ESP32-S3 modules do).
[env:waveshare-esp32s3]
platform = espressif32
board = esp32-s3-devkitc-1      ; generic ESP32-S3; set to your exact board if needed
; If your Waveshare board is e.g. esp32-s3-zero, use: board = esp32-s3-zero
framework = arduino
board_build.flash_mode = qio
upload_speed = 921600
monitor_speed = 115200

; Enable octal/quad PSRAM only if your module has it. If your board has NO
; PSRAM, comment the next two lines out (the firmware works fine without it
; because the blocklist lives on the SD card, not in RAM).
board_build.arduino.memory_type = qio_qspi
build_flags =
  -DBOARD_HAS_PSRAM

; No external libraries required: WiFi, WiFiUdp, SD_MMC, WebServer, Preferences
; and LittleFS are all in the Arduino-ESP32 core.
lib_deps =
