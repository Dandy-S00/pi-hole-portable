name: Build ESP32-S3 Pi-hole firmware

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      board:
        description: 'PlatformIO board target'
        required: false
        default: 'esp32-s3-devkitc-1'
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set board from input (optional)
        if: ${{ github.event.inputs.board != '' }}
        run: |
          echo "Building for board: ${{ github.event.inputs.board }}"
          sed -i "s/^board = .*/board = ${{ github.event.inputs.board }}/" platformio.ini

      - name: Build firmware with PlatformIO
        uses: platformio/platformio-action@v1
        with:
          projects: .
          targets: build

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: esp32s3-pihole-firmware-${{ github.event.inputs.board || 'esp32-s3-devkitc-1' }}
          path: |
            .pio/build/*/firmware.bin
            .pio/build/*/partitions.bin
            .pio/build/*/bootloader.bin
            .pio/build/*/*.elf
          if-no-files-found: error
          retention-days: 30
