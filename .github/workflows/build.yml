name: Build ESP32-S3 Pi-hole firmware

on:
  push:
    branches: [ main, master ]
    paths:
      - 'src/**'
      - 'platformio.ini'
      - '.github/workflows/build.yml'
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      board:
        description: 'PlatformIO board target'
        required: false
        default: 'esp32-s3-devkitc-1'
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install PlatformIO
        run: |
          python -m pip install --upgrade pip
          pip install platformio

      - name: Build firmware (PlatformIO)
        env:
          PLATFORMIO_CI_BOARD: ${{ github.event.inputs.board || 'esp32-s3-devkitc-1' }}
        run: |
          echo "Building for board: ${PLATFORMIO_CI_BOARD}"
          # Allow overriding the board from CI without editing platformio.ini
          sed -i "s/^board = .*/board = ${PLATFORMIO_CI_BOARD}/" platformio.ini
          pio run

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: esp32s3-pihole-firmware-${{ github.event.inputs.board || 'esp32-s3-devkitc-1' }}
          path: |
            .pio/build/*/firmware.bin
            .pio/build/*/partitions.bin
            .pio/build/*/bootloader.bin
            .pio/build/*/*.elf
          if-no-files-found: error
          retention-days: 30
